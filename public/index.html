<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureID — Secure Identity & Access Management</title>
  <meta name="description" content="SecureID — Secure identity and access management with MFA.">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--clr-gray-50);
    }
    .landing {
      text-align: center;
      max-width: 400px;
      padding: var(--sp-8) var(--sp-6);
    }
    .landing-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--clr-primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto var(--sp-5);
    }
    .landing h1 {
      font-size: var(--fs-2xl);
      font-weight: 700;
      color: var(--clr-gray-900);
      margin-bottom: var(--sp-2);
      letter-spacing: -0.01em;
    }
    .landing p {
      font-size: var(--fs-base);
      color: var(--clr-gray-500);
      margin-bottom: var(--sp-8);
    }
    .landing-btns {
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
    }
  </style>
</head>
<body>
  <div class="landing">
    <div class="landing-icon">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#3B5BDB"
        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <rect x="9" y="11" width="6" height="5" rx="1"/>
        <path d="M12 11V9a2 2 0 012-2"/>
      </svg>
    </div>
    <h1>SecureID</h1>
    <p>Secure identity &amp; access management<br>with multi-factor authentication.</p>
    <div class="landing-btns">
      <a href="/login.html" class="btn btn-primary">Login</a>
      <a href="/register.html" class="btn btn-outline">Create an Account</a>
    </div>
  </div>
  <script src="/js/validation.js"></script>
  <script>
    // Auto-redirect to dashboard if already authenticated
    (async () => {
      const { data } = await apiCall('GET', '/api/me');
      if (data && data.userId) window.location.href = '/dashboard.html';
    })();
  </script>
</body>
</html>
